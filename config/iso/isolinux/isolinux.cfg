default live
prompt 1
timeout 50

# Fallback text & graphical options
label live
  menu label ^Probar NOXEnOS Linux (Modo Live)
  kernel /casper/vmlinuz
  append boot=casper initrd=/casper/initrd quiet splash locale=es_ES.UTF-8 console-setup/layoutcode=es ---

label install
  menu label ^Instalar NOXEnOS Linux directamente
  kernel /casper/vmlinuz
  append boot=casper only-ubiquity initrd=/casper/initrd quiet splash locale=es_ES.UTF-8 console-setup/layoutcode=es ---

label safe
  menu label Probar NOXEnOS (Graficos ^Seguros)
  kernel /casper/vmlinuz
  append boot=casper nomodeset initrd=/casper/initrd quiet splash locale=es_ES.UTF-8 console-setup/layoutcode=es ---

label check
  menu label ^Comprobar integridad del medio
  kernel /casper/vmlinuz
  append boot=casper integrity-check initrd=/casper/initrd quiet splash ---
