# NOXEnOS Linux GRUB Configuration
set default="0"
set timeout=10

insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod all_video
insmod font
insmod gfxterm
insmod png

set gfxmode=auto
terminal_output gfxterm

# Styling colors (Electric Cyan on Deep Slate)
set menu_color_normal=white/black
set menu_color_highlight=cyan/dark-gray

menuentry "Probar NOXEnOS Linux (Modo Live)" --class noxenos --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash locale=es_ES.UTF-8 console-setup/layoutcode=es ---
    initrd /casper/initrd
}

menuentry "Instalar NOXEnOS Linux directamente" --class noxenos --class installer --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper only-ubiquity quiet splash locale=es_ES.UTF-8 console-setup/layoutcode=es ---
    initrd /casper/initrd
}

menuentry "Probar NOXEnOS Linux (Gráficos Seguros / Modo Compatibilidad)" --class noxenos --class gnu-linux {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper nomodeset quiet splash locale=es_ES.UTF-8 console-setup/layoutcode=es ---
    initrd /casper/initrd
}

menuentry "Comprobar integridad del medio de instalación" --class check {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd /casper/initrd
}

menuentry "Reiniciar equipo" {
    reboot
}
