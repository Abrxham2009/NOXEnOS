# Calamares Users Module Configuration for NOXEnOS
---
defaultGroups:
    - sudo
    - adm
    - cdrom
    - dip
    - plugdev
    - audio
    - video
    - netdev
    - lpadmin

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
emptyRootPassword: true

defaultShell: /bin/bash
hostname:
    writeEtcHosts: true
    writeEtcHostname: true
