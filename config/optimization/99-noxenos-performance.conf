# NOXEnOS Linux - Performance & Memory Tuning

# Keep applications in fast RAM, swap only under real pressure
vm.swappiness=10

# Favor keeping filesystem inode and dentry caches in RAM for rapid file access
vm.vfs_cache_pressure=50

# Improve write buffering for SSDs and NVMe drives
vm.dirty_background_ratio=5
vm.dirty_ratio=10

# Increase inotify user watches for developer tools and Dolphin
fs.inotify.max_user_watches=524288
fs.file-max=2097152

# Network responsiveness optimizations
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_fastopen=3
